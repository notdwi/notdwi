name: Refresh GitHub profile photo

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-avatar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh photo and rebuild profile
        run: python scripts/build_profile.py --refresh-avatar
      - name: Validate generated assets
        run: python scripts/validate_profile.py
      - name: Save updated photo
        run: |
          git add README.md assets/profile-v7 assets/github-avatar.png
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh current GitHub profile photo'
            git push
          fi
