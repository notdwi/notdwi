@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 27h360m280 0h360" stroke="#e9dfe9"/><text x="500" y="33" text-anchor="middle" font-size="14" fill="#706376">code, coffee jelly, repeat.</text></svg>