<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-labelledby="title"><title id="title">KoeWeeb: A web-based manga reader. Scraping with a focused reading UI. Web / Scraping / Manga</title><style>text{font-family:'Trebuchet MS','DejaVu Sans',sans-serif}
.signal{animation:signal 3s ease-in-out infinite}
.track{stroke-dasharray:70 930;animation:travel 9s linear infinite}
.cursor{animation:blink 1.4s step-end infinite}
@keyframes signal{50%{opacity:.35}}
@keyframes travel{to{stroke-dashoffset:-1000}}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
