<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-labelledby="title"><title id="title">PokeCenter: Pokémon management platform. JWT authentication and admin tools. Next.js / NestJS / PostgreSQL</title><style>text{font-family:'Trebuchet MS','DejaVu Sans',sans-serif}
.signal{animation:signal 3s ease-in-out infinite}
.track{stroke-dasharray:70 930;animation:travel 9s linear infinite}
.cursor{animation:blink 1.4s step-end infinite}
