<svg xmlns="http://www.w3.org/2000/svg" width="800" height="104" viewBox="0 0 800 104" role="img" aria-labelledby="title"><title id="title">Full-stack developer based in Brazil. Currently building Noctyra. Into Linux, anime and clean APIs.</title><style>text{font-family:'Trebuchet MS','DejaVu Sans',sans-serif}
.reveal{animation:reveal 1.2s ease-out both}
.pulse{animation:pulse 3.4s ease-in-out infinite}
