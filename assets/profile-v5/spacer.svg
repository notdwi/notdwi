<svg xmlns="http://www.w3.org/2000/svg" width="100" height="1" viewBox="0 0 100 1" role="img" aria-labelledby="title"><title id="title"></title><style>text{font-family:'Trebuchet MS','DejaVu Sans',sans-serif}
.reveal{animation:reveal 1.2s ease-out both}
.pulse{animation:pulse 3.4s ease-in-out infinite}
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></svg>