name: Validate profile

on:
  push:
    paths:
      - README.md
      - assets/**
      - scripts/**
      - .github/workflows/expressive-profile.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check artwork and local image references
        run: python scripts/validate_profile.py
