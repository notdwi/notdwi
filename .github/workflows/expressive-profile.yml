name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: metawka/expressive-profile@v1
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Remove Expressive Profile credit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = '<a href="https://metawka.github.io/expressive-profile/?from=notdwi">'
          start = text.find(marker)
          if start != -1:
              end = text.find('</a>', start)
              if end != -1:
                  text = text[:start] + text[end+4:]
          from shutil import copyfile
          for theme in ("dark", "light"):
              copyfile(f"assets/social-2-{theme}.svg", f"assets/social-portfolio-{theme}.svg")
              text = text.replace(f"assets/social-2-{theme}.svg?v=3", f"assets/social-portfolio-{theme}.svg")
              text = text.replace(f"assets/social-2-{theme}.svg", f"assets/social-portfolio-{theme}.svg")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/social-portfolio-dark.svg assets/social-portfolio-light.svg
          git diff --cached --quiet || git commit -m "Remove Expressive Profile credit"
          git push
