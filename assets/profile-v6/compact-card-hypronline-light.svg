<svg xmlns="http://www.w3.org/2000/svg" width="432" height="217" viewBox="0 0 432 217" role="img" aria-labelledby="title"><title id="title">HyprOnline: Anime search in your terminal. Scraping and direct video streaming. Python / CLI / Streaming</title><style>text{font-family:'Trebuchet MS','DejaVu Sans',sans-serif}
.reveal{opacity:1}
.orbit{transform-origin:154px 155px;animation:orbit 36s linear infinite}
.drift{animation:drift 6s ease-in-out infinite}
.cursor{animation:blink 1.2s step-end infinite}
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes drift{50%{transform:translateY(-7px)}}
@keyframes blink{50%{opacity:0}}
