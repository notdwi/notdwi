<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title"><title id="title">Gean / notdwi — Full-stack Software Developer. Minimal typography with a coffee jelly illustration inspired by Saiki Kusuo.</title><style>text{font-family:'Trebuchet MS','DejaVu Sans',sans-serif}
.reveal{animation:reveal 1.2s ease-out both}
.pulse{animation:pulse 3.4s ease-in-out infinite}
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g class="reveal">
<text x="20" y="42" fill="#726377" font-size="17">やれやれ。</text>
<text x="16" y="134" fill="#352a39" font-size="78" font-weight="700" letter-spacing="-4">hey, i'm gean.</text>
<text x="22" y="181" fill="#a4406e" font-size="24">Full-stack Software Developer</text>
<text x="22" y="223" fill="#726377" font-size="16">@notdwi / Brazil</text>
</g>
