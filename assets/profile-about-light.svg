@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="reveal"><text x="4" y="33" font-size="25" fill="#352a39">Full-stack developer. Based in Brazil.</text><circle cx="10" cy="72" r="4" fill="#487357" class="pulse"/><text x="26" y="79" font-size="21" fill="#726377">Currently building Noctyra. Into Linux, anime &amp; clean APIs.</text></g></svg>